<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <title>Frontend Mentor | Browser extensions manager UI</title>

    <!-- Виконується ДО того, як браузер намалює сторінку і запуститься React.
         Без цього людина з темною системною темою спершу побачила б "спалах"
         світлої сторінки. React потім просто прочитає вже встановлене значення. -->
    <script>
      document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)')
        .matches
        ? 'dark'
        : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
